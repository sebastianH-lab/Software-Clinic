	<link rel="stylesheet" href="styles.css">
	<style>
		.register-page {
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			background: radial-gradient(circle at 85% 15%, #e6f4eb 0, transparent 35%);
		}

		.register-header {
			padding: 22px 0;
			border-bottom: 1px solid var(--line);
			background: rgba(251, 250, 245, .9);
		}

		.register-header .container {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 20px;
		}

		.back-link { color: var(--muted); font-size: .95rem; }
		.back-link:hover { color: var(--green-dark); }

		.register-main {
			flex: 1;
			display: grid;
			place-items: center;
			padding: 48px 0;
		}

		.register-card {
			width: min(100%, 520px);
			padding: 40px;
			border: 1px solid var(--line);
			border-radius: 12px;
			background: var(--white);
			box-shadow: 0 18px 50px rgba(33, 96, 79, .1);
		}

		.register-card h1 { margin-bottom: 10px; font-size: 2rem; }
		.register-intro { margin-bottom: 28px; color: var(--muted); }
		.register-form { display: grid; gap: 17px; }
		.field { display: grid; gap: 7px; }
		.field label { font-weight: 700; font-size: .92rem; }

		.field input,
		.field select {
			width: 100%;
			padding: 13px 14px;
			border: 1px solid #c8d9d2;
			border-radius: 7px;
			color: var(--ink);
			background: var(--cream);
			font: inherit;
			outline: none;
		}

		.field input:focus,
		.field select:focus {
			border-color: var(--green);
			box-shadow: 0 0 0 3px var(--mint);
		}

		.phone-fields { display: grid; grid-template-columns: 155px 1fr; gap: 10px; }
		.password-help { margin: -1px 0 0; color: var(--muted); font-size: .82rem; }

		.terms {
			display: flex;
			align-items: flex-start;
			gap: 9px;
			color: var(--muted);
			font-size: .88rem;
		}

		.terms input { flex: 0 0 auto; margin-top: 5px; accent-color: var(--green); }
		.terms a { color: var(--green-dark); font-weight: 700; }
		.terms a:hover { text-decoration: underline; }
		.register-submit { width: 100%; margin-top: 3px; }

		.login-prompt { margin: 24px 0 0; color: var(--muted); text-align: center; font-size: .92rem; }
		.login-prompt a { color: var(--green-dark); font-weight: 700; }

		@media (max-width: 540px) {
			.container { width: min(100% - 28px, 520px); }
			.register-card { padding: 28px 22px; }
			.phone-fields { grid-template-columns: 1fr; gap: 17px; }
		}
	</style>
</head>

					<label for="confirm-password">Confirmar contraseña</label>
